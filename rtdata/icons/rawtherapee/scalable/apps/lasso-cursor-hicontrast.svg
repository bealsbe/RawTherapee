<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24px"
   height="24px"
   viewBox="0 0 24 24"
   version="1.1"
   id="SVGRoot"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!-- Lasso cursor for the Masks tool. Hotspot is the rope end at the bottom-left corner (1, 23). -->
  <g id="layer1">
    <!-- loop -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 13,2 C 18,2 22,4.5 22,8 22,11.5 18,14 13,14 10.5,14 8.5,13.4 7,12.4 5.5,13.4 4,13.3 4,12 4,10.5 5,9.8 5.8,9.3 5,8.9 4.5,8.5 4.5,8 4.5,4.5 8,2 13,2 Z M 13,4 C 9,4 6.5,5.8 6.5,8 6.5,10.2 9,12 13,12 17,12 20,10.2 20,8 20,5.8 17,4 13,4 Z" />
    <!-- rope down to the hotspot -->
    <path
       style="fill:none;stroke:#000000;stroke-width:3;stroke-linecap:round"
       d="M 5.5,12.5 C 4.5,15 3.5,18 1.5,22.5" />
    <path
       style="fill:none;stroke:#ffffff;stroke-width:1.2;stroke-linecap:round"
       d="M 5.5,12.5 C 4.5,15 3.5,18 1.5,22.5" />
  </g>
</svg>
