<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24px"
   height="24px"
   viewBox="0 0 24 24"
   version="1.1"
   id="SVGRoot"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!-- Magic wand cursor for the Masks tool. Hotspot is the tip of the wand at the top-left corner (1, 1). -->
  <g id="layer1">
    <!-- stick from the tip (1,1) to the bottom-right -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 5.5,4.2 7,2.7 22.3,18 20.8,19.5 Z" />
    <!-- tip star -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 4,0.5 5,3 7.5,4 5,5 4,7.5 3,5 0.5,4 3,3 Z" />
    <!-- sparkles -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.8;stroke-linejoin:round"
       d="M 10.5,1 11,2.3 12.3,2.8 11,3.3 10.5,4.6 10,3.3 8.7,2.8 10,2.3 Z M 1.5,9.5 2,10.8 3.3,11.3 2,11.8 1.5,13.1 1,11.8 -0.3,11.3 1,10.8 Z" />
  </g>
</svg>
