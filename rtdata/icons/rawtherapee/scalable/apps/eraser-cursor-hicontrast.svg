<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24px"
   height="24px"
   viewBox="0 0 24 24"
   version="1.1"
   id="SVGRoot"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!-- Eraser cursor for the Masks tool. Hotspot is the working edge at the bottom-left corner. -->
  <g id="layer1">
    <!-- eraser body (rotated 45 degrees), working edge at (1, 23) -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 15.5,1.5 22.5,8.5 8,23 1,16 Z" />
    <!-- rubber part, darker band near the working edge -->
    <path
       style="fill:#000000;fill-opacity:0.35;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 5.5,11.5 12.5,18.5 8,23 1,16 Z" />
  </g>
</svg>
