<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24px"
   height="24px"
   viewBox="0 0 24 24"
   version="1.1"
   id="SVGRoot"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!-- Brush cursor for the Masks tool. Hotspot is the bristle tip at the bottom-left corner. -->
  <g id="layer1">
    <!-- handle -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 21.5,1.2 C 22.3,0.6 23.4,1.7 22.8,2.5 L 11.6,15.2 8.8,12.4 Z" />
    <!-- ferrule -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 8.1,13.1 10.9,15.9 9.5,17.3 6.7,14.5 Z" />
    <!-- bristles, tip at (1, 23) -->
    <path
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-linejoin:round"
       d="M 6.2,15.2 8.8,17.8 C 8.2,19.6 6.8,21.5 4.6,22.1 3.4,22.5 2.1,22.8 1,23 1.4,21.7 1.6,20.4 2.1,19.2 2.8,17.3 4.4,15.9 6.2,15.2 Z" />
  </g>
</svg>
